<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Shops — Sankofa Market</title>
    <meta name="description" content="Browse every branded vendor shop on Sankofa Market — Ghana's escrow-protected marketplace.">
    <link rel="icon" type="image/png" href="/images/logos/sankofa-market-favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/icons.css?v=2">
    <link rel="stylesheet" href="/css/main.css?v=33">
    <link rel="stylesheet" href="/css/storefront.css?v=11">
    <link rel="stylesheet" href="/css/a11y.css?v=2">
    <style>
        .shops-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin: 1.2rem 0 2rem; }
        .shop-card { border: 1px solid #e5e7eb; border-radius: 16px; overflow: hidden; background: #fff; text-decoration: none; color: inherit; transition: transform 0.15s, box-shadow 0.15s; display: block; }
        .shop-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .shop-card-band { height: 72px; background: linear-gradient(135deg, var(--sh-c1, #0064d2), var(--sh-c2, #004a99)); position: relative; }
        .shop-card-logo { position: absolute; left: 14px; bottom: -22px; width: 52px; height: 52px; border-radius: 14px; border: 3px solid #fff; background: #f3f4f6; object-fit: cover; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #5a6572; font-size: 1.1rem; }
        .shop-card-logo img { width: 100%; height: 100%; object-fit: cover; }
        .shop-card-body { padding: 1.8rem 0.9rem 0.9rem; }
        .shop-card-body h3 { margin: 0; font-size: 0.95rem; font-weight: 800; color: #191919; }
        .shop-card-body p { margin: 0.3rem 0 0; font-size: 0.78rem; color: #5a6572; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .shop-card-meta { display: flex; gap: 0.5rem; margin-top: 0.55rem; font-size: 0.7rem; color: #9aa5b1; align-items: center; flex-wrap: wrap; }
        .shops-search-row { display: flex; gap: 0.6rem; align-items: center; margin-top: 1.1rem; max-width: 480px; }
        .shops-search-row input { flex: 1; padding: 0.65rem 0.9rem; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 0.9rem; outline: none; }
        .shops-search-row input:focus { border-color: #0064d2; }
    </style>
</head>
<body>
    <header class="header" style="position:sticky;top:0;z-index:100;">
        <div class="container header-inner">
            <a href="/index.html" class="logo">
                <img src="/images/logos/sankofa-market-logo-full-color.png" alt="Sankofa Market" class="logo-img" decoding="async">
            </a>
            <div class="header-actions" style="margin-left:auto;">
                <a href="/pages/user/my-store.html" class="btn btn-secondary"><i class="fas fa-store"></i> Open your own shop</a>
            </div>
        </div>
    </header>

    <main class="container" style="padding-bottom:2rem;">
        <div class="section-header" style="margin-top:1.4rem;">
            <h2 class="section-title"><i class="fas fa-store-alt" style="color: var(--primary-color);"></i> Vendor Shops <span class="store-count-pill" id="shopsCount"></span></h2>
        </div>
        <p style="font-size:0.88rem;color:#5a6572;margin-top:-0.4rem;">Branded mini-shops run by sellers on Sankofa Market — every purchase stays escrow-protected.</p>

        <div class="shops-search-row">
            <i class="fas fa-search" style="color:#9aa5b1;"></i>
            <input type="text" id="shopsSearch" placeholder="Find a shop by name, town or what they sell…">
        </div>

        <div class="shops-grid" id="shopsGrid">
            <div style="grid-column:1/-1;text-align:center;padding:2.5rem;color:#9aa5b1;"><i class="fas fa-circle-notch fa-spin" style="font-size:1.6rem;"></i><p>Loading shops…</p></div>
        </div>
    </main>

    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script defer src="/config/firebase-config.js?v=8"></script>
    <script defer src="/js/watchdog.js?v=2"></script>
    <script defer src="/dist/main-7XWOFUM3.js"></script>
    <script defer src="/js/shops.js?v=1"></script>
    <script defer src="/js/maintenance-mode.js?v=1"></script>
</body>
</html>
