<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages Management - Admin - Sankofa Market</title>
    <link rel="icon" type="image/png" href="../../images/logos/sankofa-market-favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/admin-messages.css">
</head>
<body>
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-header">
            <img src="../../images/logos/sankofa-market-logo-full-color.png" alt="Sankofa Market" class="sidebar-logo">
            <span class="sidebar-badge">Admin</span>
        </div>
        
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-chart-pie"></i> <span>Overview</span>
            </a>
            <a href="dashboard.html#products" class="nav-item">
                <i class="fas fa-box"></i> <span>Products</span>
            </a>
            <a href="dashboard.html#users" class="nav-item">
                <i class="fas fa-users"></i> <span>Users</span>
            </a>
            <a href="dashboard.html#orders" class="nav-item">
                <i class="fas fa-shopping-cart"></i> <span>Orders</span>
            </a>
            <a href="messages.html" class="nav-item active">
                <i class="fas fa-comments"></i> <span>Messages</span>
                <span class="nav-badge" id="unreadMessages">12</span>
            </a>
            <a href="dashboard.html#categories" class="nav-item">
                <i class="fas fa-th-large"></i> <span>Categories</span>
            </a>
            <a href="dashboard.html#reports" class="nav-item">
                <i class="fas fa-flag"></i> <span>Reports</span>
            </a>
            <a href="analytics.html" class="nav-item">
                <i class="fas fa-chart-line"></i> <span>Analytics</span>
            </a>
            <a href="dashboard.html#settings" class="nav-item">
                <i class="fas fa-cog"></i> <span>Settings</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="../../index.html" class="nav-item">
                <i class="fas fa-globe"></i> <span>View Site</span>
            </a>
            <a href="#" class="nav-item" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <!-- Top Bar -->
        <header class="admin-topbar">
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
            <div class="topbar-search">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search messages, users..." id="globalSearch">
            </div>
            <div class="topbar-actions">
                <button class="topbar-btn" title="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="notif-dot"></span>
                </button>
                <div class="topbar-user">
                    <img src="https://images.unsplash.com/photo-1506277886164-e25aa3f4ef7f?w=40&h=40&fit=crop&crop=face&q=75&auto=format" alt="Admin" class="topbar-avatar" loading="lazy" decoding="async">
                    <span>Admin</span>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="admin-content">
            <!-- Messages Section -->
            <section class="admin-section active" id="section-messages">
                <div class="section-header">
                    <h1>Messages Management</h1>
                    <div class="header-actions">
                        <button class="btn btn-outline btn-small" id="exportMessagesBtn">
                            <i class="fas fa-download"></i> Export
                        </button>
                        <button class="btn btn-outline btn-small" id="refreshMessagesBtn">
                            <i class="fas fa-sync"></i> Refresh
                        </button>
                    </div>
                </div>

                <!-- Filters -->
                <div class="filter-bar">
                    <select class="filter-select" id="messageStatusFilter">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="flagged">Flagged</option>
                        <option value="reported">Reported</option>
                        <option value="archived">Archived</option>
                    </select>
                    <select class="filter-select" id="messageTypeFilter">
                        <option value="">All Types</option>
                        <option value="buyer-seller">Buyer-Seller</option>
                        <option value="support">Support</option>
                        <option value="dispute">Dispute</option>
                    </select>
                    <input type="text" class="filter-search" placeholder="Search messages..." id="messageSearch">
                </div>

                <!-- Messages Layout -->
                <div class="messages-layout">
                    <!-- Conversations List -->
                    <div class="conversations-list" id="conversationsList">
                        <div class="conversations-header">
                            <h3>Conversations</h3>
                            <span class="conversations-count">24 conversations</span>
                        </div>
                        <div class="conversations-container" id="conversationsContainer">
                            <!-- Conversation 1 -->
                            

                            <!-- Conversation 2 -->
                            

                            <!-- Message 2 -->
                            
                            </div>

                            <!-- Message 4 -->
                            
                            </div>
                        </div>

                        <div class="chat-input-area">
                            <div class="chat-input-wrapper">
                                <textarea class="chat-input" id="chatInput" placeholder="Type a message as admin..." rows="1"></textarea>
                                <button class="send-message-btn" id="sendMessageBtn">
                                    <i class="fas fa-paper-plane"></i>
                                </button>
                            </div>
                            <div class="chat-input-actions">
                                <button class="input-action-btn" title="Attach file">
                                    <i class="fas fa-paperclip"></i>
                                </button>
                                <button class="input-action-btn" title="Send as warning">
                                    <i class="fas fa-exclamation-triangle"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../../config/firebase-config.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/admin.js"></script>
    <script src="../../js/admin-auth.js"></script>
    <script src="../../js/admin-messages.js"></script>
</body>
</html>
