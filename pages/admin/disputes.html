<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dispute Resolution - Admin - Sankofa Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/main.css?v=4">
    <link rel="stylesheet" href="../../css/admin.css?v=9">
    <link rel="stylesheet" href="../../css/disputes.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-header">
                <img src="../../images/logos/sankofa-market-logo-full-color.png" alt="Sankofa Market" class="sidebar-logo">
                <span class="sidebar-badge">Admin</span>
            <button class="sidebar-close" id="sidebarClose" aria-label="Close menu"><i class="fas fa-times"></i></button>
            </div>
            <nav class="sidebar-nav">
                <a href="/sm-panel/dashboard" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/sm-panel/dashboard#section-orders" class="nav-item">
                    <i class="fas fa-shopping-bag"></i>
                    <span>Orders</span>
                </a>
                <a href="/sm-panel/dashboard#section-products" class="nav-item">
                    <i class="fas fa-box"></i>
                    <span>Products</span>
                </a>
                <a href="/sm-panel/dashboard#section-users" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Users</span>
                </a>
                <a href="/sm-panel/dashboard#section-orders" class="nav-item">
                    <i class="fas fa-money-bill-wave"></i>
                    <span>Transactions</span>
                </a>
                <a href="/sm-panel/disputes" class="nav-item active">
                    <i class="fas fa-gavel"></i>
                    <span>Disputes</span>
                    <span class="nav-badge" id="disputeCount" style="display:none;">0</span>
                </a>
                <a href="/sm-panel/dashboard#section-settings" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="../../index.html" class="nav-item">
                    <i class="fas fa-external-link-alt"></i>
                    <span>View Site</span>
                </a>
                <a href="#" class="nav-item" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <div class="header-content">
                    <h1>Dispute Resolution</h1>
                    <p>Review and resolve buyer-seller disputes</p>
                </div>
            </header>

            <!-- Filters -->
            <div class="filters-bar">
                <div class="filter-group">
                    <label>Status:</label>
                    <select id="statusFilter" class="filter-select">
                        <option value="all">All Disputes</option>
                        <option value="open">Open</option>
                        <option value="reviewing">Under Review</option>
                        <option value="resolved">Resolved</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Reason:</label>
                    <select id="reasonFilter" class="filter-select">
                        <option value="all">All Reasons</option>
                        <option value="item_not_received">Item Not Received</option>
                        <option value="item_not_as_described">Not As Described</option>
                        <option value="defective_item">Defective Item</option>
                        <option value="wrong_item">Wrong Item</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="filter-group">
                    <input type="text" id="searchDisputes" class="filter-input" placeholder="Search by order ID or user...">
                </div>
            </div>

            <!-- Disputes List -->
            <div class="disputes-list" id="disputesList">
                <!-- Disputes will be loaded here -->
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading disputes...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Dispute Detail Modal -->
    <div class="modal-overlay" id="disputeModal" style="display: none;">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>Dispute Details</h2>
                <button class="modal-close" onclick="closeDisputeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="disputeModalBody">
                <!-- Dispute details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- App Scripts -->
    <script src="../../config/firebase-config.js"></script>
    <script src="../../js/main.js?v=4"></script>
    <script src="../../js/admin.js?v=8"></script>
    <script src="../../js/disputes-admin.js"></script>
    <script src="../../js/admin-auth.js"></script>
</body>
</html>
