<style>
.app-bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e5;padding:0.3rem 0 calc(0.3rem + env(safe-area-inset-bottom,0px));z-index:999;box-shadow:0 -4px 20px rgba(0,0,0,0.06);display:none;}
.app-bottom-nav-inner{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto;align-items:end;}
.app-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.15rem;padding:0.35rem 0.15rem;color:#767676;text-decoration:none;font-size:0.62rem;font-weight:600;font-family:'Poppins',sans-serif;position:relative;-webkit-tap-highlight-color:transparent;}
.app-nav-item i{font-size:1.2rem;line-height:1;}
.app-nav-item.active{color:#0064d2;}
.app-nav-item.sell i{background:linear-gradient(135deg,#f5af02 0%,#e09e00 100%);color:#191919;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-top:-0.9rem;box-shadow:0 4px 12px rgba(245,175,2,0.35);border:3px solid #fff;}
.app-nav-badge{position:absolute;top:0.1rem;right:22%;min-width:16px;height:16px;padding:0 4px;background:#ef4444;color:#fff;font-size:0.6rem;font-weight:800;border-radius:999px;display:none;align-items:center;justify-content:center;border:1.5px solid #fff;line-height:1;}
@media(max-width:768px){.app-bottom-nav{display:block;}body{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));}}
</style>

<style id="adminGateHide">
/* The whole admin shell stays hidden until the access check passes.
   js/admin-auth.js reveals these on success and shows the access-denied screen otherwise. */
.admin-sidebar,
.admin-topbar,
main.admin-main,
.admin-main { display: none !important; }
</style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-header">
                <img src="/images/logos/sankofa-market-logo-full-color.png" alt="Sankofa Market" class="sidebar-logo" decoding="async">
                <span class="sidebar-badge">Admin</span>
            <button class="sidebar-close" id="sidebarClose" aria-label="Close menu"><i class="fas fa-times"></i></button>
            </div>
            <nav class="sidebar-nav">
                <a href="/sm-panel/dashboard" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/sm-panel/dashboard#section-orders" class="nav-item">
                    <i class="fas fa-shopping-bag"></i>
                    <span>Orders</span>
                </a>
                <a href="/sm-panel/dashboard#section-products" class="nav-item">
                    <i class="fas fa-box"></i>
                    <span>Products</span>
                </a>
                <a href="/sm-panel/dashboard#section-users" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Users</span>
                </a>
                <a href="/sm-panel/dashboard#section-orders" class="nav-item">
                    <i class="fas fa-money-bill-wave"></i>
                    <span>Transactions</span>
                </a>
                <a href="/sm-panel/disputes" class="nav-item active">
                    <i class="fas fa-gavel"></i>
                    <span>Disputes</span>
                    <span class="nav-badge" id="disputeCount" style="display:none;">0</span>
                </a>
                <a href="/sm-panel/payouts" class="nav-item">
                    <i class="fas fa-money-bill-transfer"></i>
                    <span>Withdrawals</span>
                    <span class="nav-badge" id="payoutCount" style="display:none;">0</span>
                </a>
                <a href="/sm-panel/email" class="nav-item">
                    <i class="fas fa-envelope"></i>
                    <span>Emails</span>
                </a>
                <a href="/sm-panel/dashboard#section-settings" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="/index.html" class="nav-item">
                    <i class="fas fa-external-link-alt"></i>
                    <span>View Site</span>
                </a>
                <a href="#" class="nav-item" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <div class="header-content">
                    <h1>Dispute Resolution</h1>
                    <p>Review and resolve buyer-seller disputes</p>
                </div>
            </header>

            <!-- Filters -->
            <div class="filters-bar">
                <div class="filter-group">
                    <label>Status:</label>
                    <select id="statusFilter" class="filter-select">
                        <option value="all">All Disputes</option>
                        <option value="open">Open</option>
                        <option value="reviewing">Under Review</option>
                        <option value="resolved">Resolved</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Reason:</label>
                    <select id="reasonFilter" class="filter-select">
                        <option value="all">All Reasons</option>
                        <option value="item_not_received">Item Not Received</option>
                        <option value="item_not_as_described">Not As Described</option>
                        <option value="defective_item">Defective Item</option>
                        <option value="wrong_item">Wrong Item</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="filter-group">
                    <input type="text" id="searchDisputes" class="filter-input" placeholder="Search by order ID or user...">
                </div>
            </div>

            <!-- Disputes List -->
            <div class="disputes-list" id="disputesList">
                <!-- Disputes will be loaded here -->
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading disputes...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Dispute Detail Modal -->
    <div class="modal-overlay" id="disputeModal" style="display: none;">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>Dispute Details</h2>
                <button class="modal-close" onclick="closeDisputeModal()">
                    <i class="fas fa-times"></i>
                </button aria-label="Close">
            </div>
            <div class="modal-body" id="disputeModalBody">
                <!-- Dispute details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <!-- App Scripts -->
    <script defer src="/config/firebase-config.js?v=9"></script>
    <script defer src="/js/watchdog.js?v=2"></script>
    <script defer src="/dist/main-7XWOFUM3.js"></script>
    <script defer src="/dist/admin-F6YTZYXI.js"></script>
    <script defer src="/js/disputes-admin.js?v=2"></script>
    <script defer src="/js/admin-auth.js?v=8"></script>

<!-- App Bottom Nav (mobile, permanent on all pages) -->
<nav class="app-bottom-nav" id="appBottomNav" aria-label="Mobile navigation">
  <div class="app-bottom-nav-inner">
    <a href="/index.html" class="app-nav-item" data-nav="home"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="/search.html" class="app-nav-item" data-nav="search"><i class="fas fa-search"></i><span>Search</span></a>
    <a href="/publish.html" class="app-nav-item sell" data-nav="sell"><i class="fas fa-plus"></i><span>Sell</span></a>
    <a href="/pages/user/messages.html" class="app-nav-item" data-nav="messages" style="position:relative;"><i class="fas fa-comments"></i><span>Messages</span><span class="app-nav-badge" id="appNavMsgBadge" style="display:none;">0</span></a>
    <a href="/pages/user/dashboard.html" class="app-nav-item" data-nav="account"><i class="fas fa-user"></i><span>Account</span></a>
  </div>
</nav>


<script>
(function(){
  try {
    var nav = document.getElementById('appBottomNav');
    if(!nav) return;
    var path = window.location.pathname;
    function isActive(href){
      if(href==='/index.html') return path==='/' || path.endsWith('/index.html');
      return path.includes(href.replace('.html',''));
    }
    var map = {
      'home':'/index.html',
      'search':'/search.html',
      'sell':'/publish.html',
      'messages':'/messages.html',
      'account':'/dashboard.html'
    };
    nav.querySelectorAll('.app-nav-item').forEach(function(a){
      var navName = a.getAttribute('data-nav');
      var href = map[navName];
      if(href && isActive(href)) a.classList.add('active');
    });
    // If firebase is available, hook badge (mirrors main.js logic, but lightweight)
    if(window.firebase && window.firebase.auth && window.firebaseDB){
      // Will be handled by main.js if present, else try once after auth
      setTimeout(function(){
        try{
          var fbAuth = window.firebase.auth();
          fbAuth.onAuthStateChanged(function(user){
            if(!user || !window.firebaseDB) return;
            window.firebaseDB.collection('conversations').where('participants','array-contains',user.uid).onSnapshot(function(snap){
              var c=0; snap.forEach(function(d){ var data=d.data(); if(data.unreadBy && data.unreadBy.indexOf(user.uid)!==-1) c++; });
              var b=document.getElementById('appNavMsgBadge');
              if(b){ if(c>0){ b.textContent=c>99?'99+':String(c); b.style.display='flex'; } else b.style.display='none'; }
            });
          });
        }catch(e){}
      }, 1500);
    }
  } catch(e){}
})();
</script>

    <script defer src="/js/maintenance-mode.js?v=1"></script>
</body>
</html>
