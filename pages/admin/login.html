<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin Login - Sankofa Market</title>
    <link rel="icon" type="image/png" href="../../images/logos/sankofa-market-favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(160deg, #0a0a1a 0%, #1a1a2e 40%, #16213e 100%);
            min-height: 100vh;
            min-height: 100dvh;
            color: #e8e8f0;
            -webkit-font-smoothing: antialiased;
        }

        .login-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 2rem 1.5rem;
            padding-top: calc(2rem + env(safe-area-inset-top, 0px));
            padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
        }

        /* Logo & Header */
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            height: 56px;
            width: auto;
            margin-bottom: 1.25rem;
            background: white;
            padding: 8px 14px;
            border-radius: 10px;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.85rem;
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.35rem;
        }

        .login-header p {
            font-size: 0.85rem;
            color: #7a7a98;
        }

        /* Form Card */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #a0a0b8;
            margin-bottom: 0.5rem;
            letter-spacing: 0.02em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.field-icon {
            position: absolute;
            left: 1rem;
            color: #5a5a78;
            font-size: 0.9rem;
            pointer-events: none;
            z-index: 1;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #e8e8f0;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        .input-wrapper input::placeholder {
            color: #5a5a78;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #0064d2;
            background: rgba(0, 100, 210, 0.08);
            box-shadow: 0 0 0 3px rgba(0, 100, 210, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            color: #5a5a78;
            cursor: pointer;
            padding: 0.5rem;
            font-size: 0.9rem;
            z-index: 1;
        }

        .toggle-password:hover { color: #a0a0b8; }

        .field-hint {
            font-size: 0.75rem;
            color: #5a5a78;
            margin-top: 0.4rem;
        }

        /* Submit Button */
        .login-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #0064d2 0%, #004a9f 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            margin-top: 1.5rem;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #0074e8 0%, #0056b3 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 100, 210, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer Link */
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
        }

        .login-footer a {
            color: #5a5a78;
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s;
        }

        .login-footer a:hover { color: #a0a0b8; }

        /* Flash Notification */
        .admin-flash {
            position: fixed;
            top: 1rem;
            left: 1rem;
            right: 1rem;
            padding: 0.85rem 1.25rem;
            border-radius: 10px;
            color: white;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.65rem;
            z-index: 100000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: flashIn 0.3s ease;
            font-family: 'Poppins', sans-serif;
            max-width: 500px;
            margin: 0 auto;
        }

        @keyframes flashIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes flashOut {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-20px); opacity: 0; }
        }

        /* ===== DESKTOP ENHANCEMENTS ===== */
        @media (min-width: 769px) {
            .login-page {
                padding: 3rem 2rem;
            }

            .login-logo { height: 64px; }

            .login-header h1 { font-size: 1.75rem; }

            .login-card {
                padding: 2.5rem;
                border-radius: 20px;
            }

            .admin-flash {
                top: 1.5rem;
                right: 1.5rem;
                left: auto;
                max-width: 400px;
            }
        }

        /* ===== SMALL MOBILE ===== */
        @media (max-width: 380px) {
            .login-page { padding: 1.5rem 1rem; }
            .login-card { padding: 1.5rem; }
            .login-logo { height: 48px; }
            .login-header h1 { font-size: 1.3rem; }
            .input-wrapper input { padding: 0.75rem 0.85rem 0.75rem 2.5rem; font-size: 0.95rem; }
            .login-btn { padding: 0.8rem; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="login-page">
        <!-- Header -->
        <div class="login-header">
            <a href="../../index.html">
                <img src="../../images/logos/sankofa-market-logo-full-color.png" alt="Sankofa Market" class="login-logo">
            </a>
            <br>
            <span class="admin-badge"><i class="fas fa-shield-alt"></i> Admin Access</span>
            <h1>Admin Login</h1>
            <p>Authorized personnel only</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <form id="adminLoginForm" autocomplete="on">
                <div class="form-group">
                    <label for="adminEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope field-icon"></i>
                        <input type="email" id="adminEmail" name="email" placeholder="sankofamarketgh@gmail.com" autocomplete="email" required inputmode="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="adminPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="adminCode">Admin Code</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key field-icon"></i>
                        <input type="text" id="adminCode" name="adminCode" placeholder="6-digit access code" autocomplete="off" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6">
                    </div>
                    <div class="field-hint">Your 6-digit admin verification code</div>
                </div>

                <button type="submit" class="login-btn" id="adminLoginBtn">
                    <i class="fas fa-shield-alt"></i>
                    <span>Access Admin Panel</span>
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="login-footer">
            <a href="../../index.html"><i class="fas fa-arrow-left"></i> Back to marketplace</a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../../config/firebase-config.js"></script>

    <script>
    // Admin Login - Self-contained, no main.js dependency
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('adminLoginForm');
        const loginBtn = document.getElementById('adminLoginBtn');
        const togglePwd = document.getElementById('togglePassword');

        // Password toggle
        togglePwd.addEventListener('click', function() {
            const input = document.getElementById('adminPassword');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        // Form submit
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            e.stopPropagation();

            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const adminCode = document.getElementById('adminCode').value.trim();

            // Validate
            if (!email || !password || !adminCode) {
                showFlash('Please fill in all fields', 'error');
                return;
            }

            if (!/^\d{6}$/.test(adminCode)) {
                showFlash('Admin code must be a 6-digit number', 'error');
                return;
            }

            // Loading state
            const btnSpan = loginBtn.querySelector('span');
            const btnIcon = loginBtn.querySelector('i');
            const originalText = btnSpan.textContent;
            btnSpan.textContent = 'Verifying...';
            btnIcon.className = 'fas fa-spinner fa-spin';
            loginBtn.disabled = true;

            try {
                if (typeof firebase === 'undefined' || !firebase.auth) {
                    showFlash('Firebase not configured. Contact system administrator.', 'error');
                    return;
                }

                // Step 1: Sign in
                const cred = await firebase.auth().signInWithEmailAndPassword(email, password);

                // Step 2: Get user doc
                const userDoc = await firebase.firestore()
                    .collection('users')
                    .doc(cred.user.uid)
                    .get();

                if (!userDoc.exists) {
                    await firebase.auth().signOut();
                    showFlash('Account not found.', 'error');
                    return;
                }

                const userData = userDoc.data();

                // Step 3: Check admin role
                if (userData.role !== 'admin') {
                    await firebase.auth().signOut();
                    showFlash('Access denied. Not an admin account.', 'error');
                    return;
                }

                // Step 4: Check admin code
                if (userData.adminCode !== adminCode) {
                    await firebase.auth().signOut();
                    showFlash('Invalid admin verification code.', 'error');
                    return;
                }

                // Step 5: Check status
                if (userData.status === 'suspended' || userData.status === 'blocked') {
                    await firebase.auth().signOut();
                    showFlash('This account has been suspended.', 'error');
                    return;
                }

                // Success
                await firebase.firestore().collection('users').doc(cred.user.uid).update({
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(() => {});

                sessionStorage.setItem('sankofa_admin', 'true');
                sessionStorage.setItem('sankofa_admin_uid', cred.user.uid);

                btnSpan.textContent = 'Redirecting...';
                showFlash('Welcome back, ' + (userData.name || 'Admin') + '!', 'success');

                // Redirect after short delay
                setTimeout(function() {
                    window.location.replace('/sm-panel/dashboard');
                }, 1200);

            } catch (error) {
                console.error('Login error:', error);
                let msg = 'Login failed. Please try again.';
                if (error.code) {
                    switch (error.code) {
                        case 'auth/user-not-found': msg = 'No account found with this email.'; break;
                        case 'auth/wrong-password':
                        case 'auth/invalid-credential': msg = 'Incorrect email or password.'; break;
                        case 'auth/too-many-requests': msg = 'Too many attempts. Try again later.'; break;
                        case 'auth/user-disabled': msg = 'This account has been disabled.'; break;
                        case 'auth/invalid-email': msg = 'Invalid email address.'; break;
                        default: msg = error.message || msg;
                    }
                }
                showFlash(msg, 'error');
            } finally {
                // Only re-enable if we didn't redirect
                if (!loginBtn.disabled) return;
                setTimeout(function() {
                    btnSpan.textContent = originalText;
                    btnIcon.className = 'fas fa-shield-alt';
                    loginBtn.disabled = false;
                }, 2000);
            }
        });

        function showFlash(message, type) {
            document.querySelectorAll('.admin-flash').forEach(function(f) { f.remove(); });

            var colors = { success: '#22c55e', error: '#ef4444', warning: '#f59e0b', info: '#3b82f6' };
            var icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };

            var flash = document.createElement('div');
            flash.className = 'admin-flash';
            flash.style.background = colors[type] || colors.info;
            flash.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + message;
            document.body.appendChild(flash);

            setTimeout(function() {
                flash.style.animation = 'flashOut 0.3s ease forwards';
                setTimeout(function() { flash.remove(); }, 300);
            }, 4000);
        }
    });
    </script>
</body>
</html>
