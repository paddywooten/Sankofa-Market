<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sign In - Sankofa Market</title>
    <link rel="icon" type="image/png" href="/images/logos/sankofa-market-favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/icons.css?v=2">
    <link rel="stylesheet" href="/css/a11y.css?v=2">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(160deg,#0a0a1a 0%,#1a1a2e 40%,#16213e 100%);min-height:100vh;min-height:100dvh;color:#f1f2f8;-webkit-font-smoothing:antialiased}
        .login-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:2rem 1.5rem;padding-top:calc(2rem + env(safe-area-inset-top,0px));padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px))}
        .login-header{text-align:center;margin-bottom:2rem}
        .login-logo{height:56px;width:auto;margin-bottom:1.25rem;background:white;padding:8px 14px;border-radius:10px}
        .login-header h1{font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:0.35rem}
        .login-header p{font-size:0.85rem;color:#b9bdd6}
        .login-card{width:100%;max-width:420px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:2rem;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
        .form-group{margin-bottom:1.25rem}
        .form-group label{display:block;font-size:0.8rem;font-weight:600;color:#c2c6dc;margin-bottom:0.5rem;letter-spacing:0.02em}
        .input-wrapper{position:relative;display:flex;align-items:center}
        .input-wrapper i.field-icon{position:absolute;left:1rem;color:#aeb3cd;font-size:0.9rem;pointer-events:none;z-index:1}
        .input-wrapper input{width:100%;padding:0.85rem 1rem 0.85rem 2.75rem;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;color:#f1f2f8;font-size:1rem;font-family:inherit;transition:all 0.2s ease;-webkit-appearance:none}
        .input-wrapper input::placeholder{color:#aeb3cd}
        .input-wrapper input:focus{outline:none;border-color:#0064d2;background:rgba(0,100,210,0.08);box-shadow:0 0 0 3px rgba(0,100,210,0.15)}
        .toggle-password{position:absolute;right:0.75rem;background:none;border:none;color:#aeb3cd;cursor:pointer;padding:0.5rem;font-size:0.9rem;z-index:1}
        .toggle-password:hover{color:#c2c6dc}
        .form-options{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;font-size:0.85rem}
        .form-options label{display:flex;align-items:center;gap:0.4rem;color:#b9bdd6;cursor:pointer}
        .form-options label input[type="checkbox"]{accent-color:#0064d2;width:16px;height:16px}
        .form-options a{color:#8ec2ff;text-decoration:none;font-weight:500}
        .form-options a:hover{text-decoration:underline}
        .login-btn{width:100%;padding:0.9rem;background:linear-gradient(135deg,#0064d2 0%,#004a9f 100%);color:white;border:none;border-radius:10px;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.5rem;transition:all 0.2s ease;margin-top:1.5rem;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
        .login-btn:hover{background:linear-gradient(135deg,#0074e8 0%,#0056b3 100%);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,100,210,0.3)}
        .login-btn:active{transform:translateY(0)}
        .login-btn:disabled{opacity:0.7;cursor:not-allowed;transform:none}
        .divider{display:flex;align-items:center;gap:1rem;margin:1.5rem 0;color:#aeb3cd;font-size:0.8rem}
        .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08)}
        .social-btn{width:100%;padding:0.75rem;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;color:#f1f2f8;font-size:0.9rem;font-weight:500;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.6rem;transition:all 0.2s ease;-webkit-tap-highlight-color:transparent}
        .social-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2)}
        .social-btn i{font-size:1.1rem}
        .social-btn .fa-google{color:#ea4335}
        .signup-link{text-align:center;margin-top:1.5rem;font-size:0.85rem;color:#b9bdd6}
        .signup-link a{color:#8ec2ff;text-decoration:none;font-weight:600}
        .signup-link a:hover{text-decoration:underline}
        .login-footer{text-align:center;margin-top:1.5rem}
        .login-footer a{color:#aeb3cd;text-decoration:none;font-size:0.85rem;display:inline-flex;align-items:center;gap:0.4rem;transition:color 0.2s}
        .login-footer a:hover{color:#c2c6dc}
        .flash{position:fixed;top:1rem;left:1rem;right:1rem;padding:0.85rem 1.25rem;border-radius:10px;color:white;font-size:0.85rem;font-weight:500;display:flex;align-items:center;gap:0.65rem;z-index:100000;box-shadow:0 4px 20px rgba(0,0,0,0.3);animation:flashIn 0.3s ease;font-family:'Poppins',sans-serif;max-width:500px;margin:0 auto}
        @keyframes flashIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
        @keyframes flashOut{from{transform:translateY(0);opacity:1}to{transform:translateY(-20px);opacity:0}}
        @media(min-width:769px){.login-page{padding:3rem 2rem}.login-logo{height:64px}.login-header h1{font-size:1.75rem}.login-card{padding:2.5rem;border-radius:20px}.flash{top:1.5rem;right:1.5rem;left:auto;max-width:400px}}
        @media(max-width:380px){.login-page{padding:1.5rem 1rem}.login-card{padding:1.5rem}.login-logo{height:48px}.login-header h1{font-size:1.3rem}.input-wrapper input{padding:0.75rem 0.85rem 0.75rem 2.5rem;font-size:0.95rem}.login-btn{padding:0.8rem;font-size:0.95rem}}
    </style>

<style>
.app-bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e5;padding:0.3rem 0 calc(0.3rem + env(safe-area-inset-bottom,0px));z-index:999;box-shadow:0 -4px 20px rgba(0,0,0,0.06);display:none;}
.app-bottom-nav-inner{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto;align-items:end;}
.app-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.15rem;padding:0.35rem 0.15rem;color:#5a6572;text-decoration:none;font-size:0.62rem;font-weight:600;font-family:'Poppins',sans-serif;position:relative;-webkit-tap-highlight-color:transparent;}
.app-nav-item i{font-size:1.2rem;line-height:1;}
.app-nav-item.active{color:#0064d2;}
.app-nav-item.sell i{background:linear-gradient(135deg,#f5af02 0%,#e09e00 100%);color:#191919;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-top:-0.9rem;box-shadow:0 4px 12px rgba(245,175,2,0.35);border:3px solid #fff;}
.app-nav-badge{position:absolute;top:0.1rem;right:22%;min-width:16px;height:16px;padding:0 4px;background:#ef4444;color:#fff;font-size:0.6rem;font-weight:800;border-radius:999px;display:none;align-items:center;justify-content:center;border:1.5px solid #fff;line-height:1;}
@media(max-width:768px){.app-bottom-nav{display:block;}body{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));}}
</style>

<style id="auth-no-nav">.app-bottom-nav{display:none !important;} body{padding-bottom:0 !important;}</style>
</head>
<body>
    <div class="login-page">
        <div class="login-header">
            <a href="/index.html">
                <img src="/images/logos/sankofa-market-logo-full-color.png" alt="Sankofa Market" class="login-logo" decoding="async">
            </a>
            <br>
            <h1>Welcome Back</h1>
            <p>Sign in to your Sankofa Market account</p>
        </div>

        <div class="login-card">
            <form id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope field-icon"></i>
                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required inputmode="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label><input type="checkbox" id="rememberMe" name="rememberMe"> Remember me</label>
                    <a href="#" id="forgotPasswordLink">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Sign In</span>
                </button>
            </form>

            <div class="divider">or continue with</div>

            <button class="social-btn" id="googleLoginBtn">
                <i class="fab fa-google"></i> Sign in with Google
            </button>
        </div>

        <div class="signup-link">
            Don't have an account? <a href="/pages/auth/register.html">Create one</a>
        </div>

        <div class="login-footer">
            <a href="/index.html"><i class="fas fa-arrow-left"></i> Back to marketplace</a>
        </div>
    </div>

    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script defer src="/config/firebase-config.js?v=8"></script>
    <script defer src="/js/maintenance-mode.js?v=1"></script>
    <script defer src="/js/watchdog.js?v=2"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var form = document.getElementById('loginForm');
        var loginBtn = document.getElementById('loginBtn');
        var togglePwd = document.getElementById('togglePassword');
        var forgotLink = document.getElementById('forgotPasswordLink');
        var googleBtn = document.getElementById('googleLoginBtn');

        // Password toggle
        togglePwd.addEventListener('click', function() {
            var input = document.getElementById('password');
            var icon = this.querySelector('i');
            if (input.type === 'password') { input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
            else { input.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        });

        // Forgot password
        forgotLink.addEventListener('click', function(e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            if (!email) { showFlash('Enter your email first, then click Forgot Password', 'warning'); return; }
            if (typeof firebase !== 'undefined' && firebase.auth) {
                firebase.auth().sendPasswordResetEmail(email)
                    .then(function() { showFlash('Password reset email sent to ' + email, 'success'); })
                    .catch(function(err) { showFlash(err.message || 'Could not send reset email', 'error'); });
            }
        });

        // Google login
        googleBtn.addEventListener('click', async function() {
            if (typeof firebase === 'undefined' || !firebase.auth) { showFlash('Firebase not configured', 'error'); return; }
            
            var origHtml = googleBtn.innerHTML;
            googleBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting to Google…';
            googleBtn.disabled = true;
            showFlash('Opening Google — please wait on slow/mobile data…', 'info');
            console.log('🔐 Starting Google sign-in...');
            console.log('firebase.auth:', !!firebase.auth, '| firebase.firestore:', !!firebase.firestore);
            
            try {
                var provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                var result = await firebase.auth().signInWithPopup(provider);
                var user = result.user;
                console.log('✅ Google sign-in success. UID:', user.uid, '| Email:', user.email);
                
                // Check/create Firestore document
                if (firebase.firestore) {
                    console.log('📄 Checking Firestore document...');
                    try {
                        var userDoc = await firebase.firestore().collection('users').doc(user.uid).get();
                        console.log('Firestore doc exists:', userDoc.exists);
                        
                        if (!userDoc.exists) {
                            console.log('📝 Creating new Firestore document for Google user...');
                            var nameParts = (user.displayName || '').split(' ');
                            await firebase.firestore().collection('users').doc(user.uid).set({
                                firstName: nameParts[0] || '',
                                lastName: nameParts.slice(1).join(' ') || '',
                                name: user.displayName || '',
                                email: user.email || '',
                                phone: user.phoneNumber || '',
                                photoURL: user.photoURL || '',
                                role: 'user',
                                status: 'pending',
                                verified: false,
                                authProvider: 'google',
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                            console.log('✅ Firestore document created');
                            await firebase.auth().signOut();
                            showFlash('Account created! Your account is pending admin approval.', 'success');
                            await firebase.auth().signOut();
                            setTimeout(function() { window.location.href = 'login.html'; }, 2000);
                            return;
                        } else {
                            var data = userDoc.data();
                            console.log('User status:', data.status);
                            if (data.status === 'blocked' || data.status === 'suspended') {
                                await firebase.auth().signOut();
                                showFlash('Your account has been blocked. Contact support.', 'error');
                                return;
                            }
                        }
                    } catch (err) {
                        console.error('❌ Firestore error:', err);
                        showFlash('Database error: ' + err.message, 'error');
                        return;
                    }
                }
                
                googleBtn.innerHTML = origHtml;
                googleBtn.disabled = false;
                showFlash('Signed in with Google!', 'success');
                // Redirect to homepage (or ?redirect= target if present) — like eBay
                (function() {
                    var params = new URLSearchParams(window.location.search);
                    var redirect = params.get('redirect');
                    var target = redirect ? ('../../' + redirect.replace(/^\//, '')) : '../../index.html';
                    setTimeout(function() { window.location.replace(target); }, 1200);
                })();
            } catch (err) {
                console.error('❌ Google sign-in error:', err);
                googleBtn.innerHTML = origHtml;
                googleBtn.disabled = false;
                showFlash(err.message || 'Google sign-in failed', 'error');
            }
        });

        // Form submit
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            e.stopPropagation();

            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            if (!email || !password) { showFlash('Please fill in all fields', 'error'); return; }

            var btnSpan = loginBtn.querySelector('span');
            var btnIcon = loginBtn.querySelector('i');
            btnSpan.textContent = 'Signing in...';
            btnIcon.className = 'fas fa-spinner fa-spin';
            loginBtn.disabled = true;

            if (typeof firebase === 'undefined' || !firebase.auth) {
                showFlash('Firebase not configured. Contact support.', 'error');
                resetBtn(); return;
            }

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then(function(cred) {
                    return firebase.firestore().collection('users').doc(cred.user.uid).get()
                        .then(function(doc) {
                            if (doc.exists) {
                                var data = doc.data();
                                if (data.status === 'pending') {
                                    firebase.auth().signOut();
                                    showFlash('Your account is pending admin approval.', 'warning');
                                    resetBtn(); return;
                                }
                                if (data.status === 'rejected') {
                                    firebase.auth().signOut();
                                    showFlash('Your registration was rejected. Contact support.', 'error');
                                    resetBtn(); return;
                                }
                            }
                            showFlash('Welcome back!', 'success');
                            btnSpan.textContent = 'Redirecting...';
                            (function() {
                                var params = new URLSearchParams(window.location.search);
                                var redirect = params.get('redirect');
                                var target = redirect ? ('../../' + redirect.replace(/^\//, '')) : '../../index.html';
                                setTimeout(function() { window.location.replace(target); }, 1200);
                            })();
                        });
                })
                .catch(function(error) {
                    var msg = 'Login failed. Please try again.';
                    if (error.code) {
                        switch(error.code) {
                            case 'auth/user-not-found': msg = 'No account found with this email.'; break;
                            case 'auth/wrong-password': case 'auth/invalid-credential': msg = 'Incorrect email or password.'; break;
                            case 'auth/too-many-requests': msg = 'Too many attempts. Try again later.'; break;
                            case 'auth/user-disabled': msg = 'This account has been disabled.'; break;
                            case 'auth/invalid-email': msg = 'Invalid email address.'; break;
                            default: msg = error.message || msg;
                        }
                    }
                    showFlash(msg, 'error');
                    resetBtn();
                });

            function resetBtn() {
                setTimeout(function() {
                    btnSpan.textContent = 'Sign In';
                    btnIcon.className = 'fas fa-sign-in-alt';
                    loginBtn.disabled = false;
                }, 1500);
            }
        });

        function showFlash(message, type) {
            document.querySelectorAll('.flash').forEach(function(f) { f.remove(); });
            var colors = { success: '#22c55e', error: '#ef4444', warning: '#f59e0b', info: '#3b82f6' };
            var icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
            var flash = document.createElement('div');
            flash.className = 'flash';
            flash.style.background = colors[type] || colors.info;
            flash.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + message;
            document.body.appendChild(flash);
            setTimeout(function() { flash.style.animation = 'flashOut 0.3s ease forwards'; setTimeout(function() { flash.remove(); }, 300); }, 4000);
        }
    });
    </script>

<!-- App Bottom Nav (mobile, permanent on all pages) -->
<nav class="app-bottom-nav" id="appBottomNav" aria-label="Mobile navigation">
  <div class="app-bottom-nav-inner">
    <a href="/index.html" class="app-nav-item" data-nav="home"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="/search.html" class="app-nav-item" data-nav="search"><i class="fas fa-search"></i><span>Search</span></a>
    <a href="/publish.html" class="app-nav-item sell" data-nav="sell"><i class="fas fa-plus"></i><span>Sell</span></a>
    <a href="/pages/user/messages.html" class="app-nav-item" data-nav="messages" style="position:relative;"><i class="fas fa-comments"></i><span>Messages</span><span class="app-nav-badge" id="appNavMsgBadge" style="display:none;">0</span></a>
    <a href="/pages/user/dashboard.html" class="app-nav-item" data-nav="account"><i class="fas fa-user"></i><span>Account</span></a>
  </div>
</nav>


<script>
(function(){
  try {
    var nav = document.getElementById('appBottomNav');
    if(!nav) return;
    var path = window.location.pathname;
    function isActive(href){
      if(href==='/index.html') return path==='/' || path.endsWith('/index.html');
      return path.includes(href.replace('.html',''));
    }
    var map = {
      'home':'/index.html',
      'search':'/search.html',
      'sell':'/publish.html',
      'messages':'/messages.html',
      'account':'/dashboard.html'
    };
    nav.querySelectorAll('.app-nav-item').forEach(function(a){
      var navName = a.getAttribute('data-nav');
      var href = map[navName];
      if(href && isActive(href)) a.classList.add('active');
    });
    // If firebase is available, hook badge (mirrors main.js logic, but lightweight)
    if(window.firebase && window.firebase.auth && window.firebaseDB){
      // Will be handled by main.js if present, else try once after auth
      setTimeout(function(){
        try{
          var fbAuth = window.firebase.auth();
          fbAuth.onAuthStateChanged(function(user){
            if(!user || !window.firebaseDB) return;
            window.firebaseDB.collection('conversations').where('participants','array-contains',user.uid).onSnapshot(function(snap){
              var c=0; snap.forEach(function(d){ var data=d.data(); if(data.unreadBy && data.unreadBy.indexOf(user.uid)!==-1) c++; });
              var b=document.getElementById('appNavMsgBadge');
              if(b){ if(c>0){ b.textContent=c>99?'99+':String(c); b.style.display='flex'; } else b.style.display='none'; }
            });
          });
        }catch(e){}
      }, 1500);
    }
  } catch(e){}
})();
</script>

</body>
