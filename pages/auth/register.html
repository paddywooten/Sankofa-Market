<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Create Account - Sankofa Market</title>
    <link rel="icon" type="image/png" href="../../images/logos/sankofa-market-favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(160deg,#0a0a1a 0%,#1a1a2e 40%,#16213e 100%);min-height:100vh;min-height:100dvh;color:#e8e8f0;-webkit-font-smoothing:antialiased}
        .register-page{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;min-height:100dvh;padding:2rem 1.5rem;padding-top:calc(2rem + env(safe-area-inset-top,0px));padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px))}
        .register-header{text-align:center;margin-bottom:1.5rem}
        .register-logo{height:48px;width:auto;margin-bottom:1rem;background:white;padding:6px 12px;border-radius:8px}
        .register-header h1{font-size:1.35rem;font-weight:700;color:#fff;margin-bottom:0.25rem}
        .register-header p{font-size:0.85rem;color:#7a7a98}
        .register-card{width:100%;max-width:480px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:1.75rem;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
        .form-group{margin-bottom:1rem}
        .form-group label{display:block;font-size:0.78rem;font-weight:600;color:#a0a0b8;margin-bottom:0.4rem;letter-spacing:0.02em}
        .input-wrapper{position:relative;display:flex;align-items:center}
        .input-wrapper i.field-icon{position:absolute;left:0.85rem;color:#5a5a78;font-size:0.85rem;pointer-events:none;z-index:1}
        .input-wrapper input,.input-wrapper select{width:100%;padding:0.78rem 0.85rem 0.78rem 2.5rem;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;color:#e8e8f0;font-size:0.95rem;font-family:inherit;transition:all 0.2s ease;-webkit-appearance:none}
        .input-wrapper input::placeholder{color:#5a5a78}
        .input-wrapper input:focus,.input-wrapper select:focus{outline:none;border-color:#0064d2;background:rgba(0,100,210,0.08);box-shadow:0 0 0 3px rgba(0,100,210,0.15)}
        .toggle-password{position:absolute;right:0.6rem;background:none;border:none;color:#5a5a78;cursor:pointer;padding:0.45rem;font-size:0.85rem;z-index:1}
        .toggle-password:hover{color:#a0a0b8}
        .field-hint{font-size:0.72rem;color:#5a5a78;margin-top:0.3rem}
        .password-strength{height:3px;border-radius:2px;background:rgba(255,255,255,0.06);margin-top:0.4rem;overflow:hidden}
        .password-strength .bar{height:100%;border-radius:2px;transition:width 0.3s,background 0.3s;width:0}
        .section-label{font-size:0.75rem;font-weight:700;color:#4a9eff;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.75rem;margin-top:0.5rem;display:flex;align-items:center;gap:0.5rem}
        .section-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06)}
        .terms-group{display:flex;align-items:flex-start;gap:0.6rem;margin:1rem 0;font-size:0.8rem;color:#7a7a98;line-height:1.5}
        .terms-group input[type="checkbox"]{accent-color:#0064d2;width:18px;height:18px;margin-top:2px;flex-shrink:0}
        .terms-group a{color:#4a9eff;text-decoration:none;font-weight:500}
        .terms-group a:hover{text-decoration:underline}
        .register-btn{width:100%;padding:0.85rem;background:linear-gradient(135deg,#0064d2 0%,#004a9f 100%);color:white;border:none;border-radius:10px;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.5rem;transition:all 0.2s ease;margin-top:0.5rem;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
        .register-btn:hover{background:linear-gradient(135deg,#0074e8 0%,#0056b3 100%);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,100,210,0.3)}
        .register-btn:active{transform:translateY(0)}
        .register-btn:disabled{opacity:0.7;cursor:not-allowed;transform:none}
        .signin-link{text-align:center;margin-top:1.25rem;font-size:0.85rem;color:#7a7a98}
        .signin-link a{color:#4a9eff;text-decoration:none;font-weight:600}
        .signin-link a:hover{text-decoration:underline}
        .register-footer{text-align:center;margin-top:1rem}
        .register-footer a{color:#5a5a78;text-decoration:none;font-size:0.8rem;display:inline-flex;align-items:center;gap:0.4rem;transition:color 0.2s}
        .register-footer a:hover{color:#a0a0b8}
        .flash{position:fixed;top:1rem;left:1rem;right:1rem;padding:0.85rem 1.25rem;border-radius:10px;color:white;font-size:0.85rem;font-weight:500;display:flex;align-items:center;gap:0.65rem;z-index:100000;box-shadow:0 4px 20px rgba(0,0,0,0.3);animation:flashIn 0.3s ease;font-family:'Poppins',sans-serif;max-width:500px;margin:0 auto}
        @keyframes flashIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
        @keyframes flashOut{from{transform:translateY(0);opacity:1}to{transform:translateY(-20px);opacity:0}}
        @media(min-width:769px){.register-page{padding:2.5rem 2rem;justify-content:center}.register-logo{height:56px}.register-header h1{font-size:1.6rem}.register-card{padding:2.25rem;border-radius:20px}.flash{top:1.5rem;right:1.5rem;left:auto;max-width:400px}}
        @media(max-width:380px){.register-page{padding:1.25rem 0.85rem}.register-card{padding:1.25rem}.register-logo{height:42px}.register-header h1{font-size:1.2rem}.form-row{grid-template-columns:1fr;gap:0}.input-wrapper input{padding:0.7rem 0.75rem 0.7rem 2.3rem;font-size:0.9rem}.register-btn{padding:0.78rem;font-size:0.95rem}}
    </style>
</head>
<body>
    <div class="register-page">
        <div class="register-header">
            <a href="../../index.html">
                <img src="../../images/logos/sankofa-market-logo-full-color.png" alt="Sankofa Market" class="register-logo">
            </a>
            <br>
            <h1>Create Your Account</h1>
            <p>Join Ghana's #1 online marketplace</p>
        </div>

        <div class="register-card">
            <form id="registerForm" autocomplete="on">
                <!-- Personal Info -->
                <div class="section-label"><i class="fas fa-user"></i> Personal Info</div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user field-icon"></i>
                            <input type="text" id="firstName" name="firstName" placeholder="Kofi" autocomplete="given-name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user field-icon"></i>
                            <input type="text" id="lastName" name="lastName" placeholder="Mensah" autocomplete="family-name" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope field-icon"></i>
                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required inputmode="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone field-icon"></i>
                        <input type="tel" id="phone" name="phone" placeholder="0XX XXX XXXX" autocomplete="tel" required inputmode="tel">
                    </div>
                </div>

                <!-- Security -->
                <div class="section-label"><i class="fas fa-lock"></i> Security</div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Min 8 characters" autocomplete="new-password" required minlength="8">
                        <button type="button" class="toggle-password" data-target="password"><i class="fas fa-eye"></i></button>
                    </div>
                    <div class="password-strength"><div class="bar" id="strengthBar"></div></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock field-icon"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="confirmPassword"><i class="fas fa-eye"></i></button>
                    </div>
                </div>

                <!-- Ghana Card Verification -->
                <div class="section-label"><i class="fas fa-id-card"></i> Ghana Card Verification</div>

                <div class="form-group">
                    <label for="ghanaCardNumber">Ghana Card Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card field-icon"></i>
                        <input type="text" id="ghanaCardNumber" name="ghanaCardNumber" placeholder="GHA-XXXXXXXXX-X" required pattern="GHA-[0-9]{9}-[0-9]" title="Format: GHA-123456789-0">
                    </div>
                    <div class="field-hint">Format: GHA-123456789-0</div>
                </div>

                <div class="form-group">
                    <label for="ghanaCardName">Name on Ghana Card</label>
                    <div class="input-wrapper">
                        <i class="fas fa-signature field-icon"></i>
                        <input type="text" id="ghanaCardName" name="ghanaCardName" placeholder="As it appears on your card" required>
                    </div>
                    <div class="field-hint">Must match your Ghana Card exactly</div>
                </div>

                <!-- Terms -->
                <div class="terms-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <span>I agree to the <a href="../terms.html" target="_blank">Terms of Service</a> and <a href="../privacy.html" target="_blank">Privacy Policy</a></span>
                </div>

                <button type="submit" class="register-btn" id="registerBtn">
                    <i class="fas fa-user-plus"></i>
                    <span>Create Account</span>
                </button>
            </form>
        </div>

        <div class="signin-link">
            Already have an account? <a href="login.html">Sign in</a>
        </div>

        <div class="register-footer">
            <a href="../../index.html"><i class="fas fa-arrow-left"></i> Back to marketplace</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../../config/firebase-config.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var form = document.getElementById('registerForm');
        var registerBtn = document.getElementById('registerBtn');

        // Password toggles
        document.querySelectorAll('.toggle-password').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var target = document.getElementById(this.dataset.target);
                var icon = this.querySelector('i');
                if (target.type === 'password') { target.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
                else { target.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
            });
        });

        // Password strength indicator
        document.getElementById('password').addEventListener('input', function() {
            var val = this.value;
            var bar = document.getElementById('strengthBar');
            var strength = 0;
            if (val.length >= 8) strength++;
            if (val.length >= 12) strength++;
            if (/[A-Z]/.test(val) && /[a-z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[^A-Za-z0-9]/.test(val)) strength++;

            var widths = ['0%', '20%', '40%', '60%', '80%', '100%'];
            var colors = ['transparent', '#ef4444', '#f59e0b', '#f59e0b', '#22c55e', '#22c55e'];
            bar.style.width = widths[strength];
            bar.style.background = colors[strength];
        });

        // Form submit
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            e.stopPropagation();

            var firstName = document.getElementById('firstName').value.trim();
            var lastName = document.getElementById('lastName').value.trim();
            var email = document.getElementById('email').value.trim();
            var phone = document.getElementById('phone').value.trim();
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var ghanaCardNumber = document.getElementById('ghanaCardNumber').value.trim();
            var ghanaCardName = document.getElementById('ghanaCardName').value.trim();
            var terms = document.getElementById('terms').checked;

            // Validation
            if (!firstName || !lastName || !email || !phone || !password || !confirmPassword || !ghanaCardNumber || !ghanaCardName) {
                showFlash('Please fill in all fields', 'error'); return;
            }
            if (password.length < 8) { showFlash('Password must be at least 8 characters', 'error'); return; }
            if (password !== confirmPassword) { showFlash('Passwords do not match', 'error'); return; }
            if (!terms) { showFlash('Please accept the Terms of Service', 'error'); return; }
            if (!/^GHA-[0-9]{9}-[0-9]$/.test(ghanaCardNumber)) { showFlash('Invalid Ghana Card format. Use: GHA-123456789-0', 'error'); return; }

            var btnSpan = registerBtn.querySelector('span');
            var btnIcon = registerBtn.querySelector('i');
            btnSpan.textContent = 'Creating account...';
            btnIcon.className = 'fas fa-spinner fa-spin';
            registerBtn.disabled = true;

            if (typeof firebase === 'undefined' || !firebase.auth) {
                showFlash('Firebase not configured. Contact support.', 'error');
                resetBtn(); return;
            }

            firebase.auth().createUserWithEmailAndPassword(email, password)
                .then(function(cred) {
                    return cred.user.updateProfile({ displayName: firstName + ' ' + lastName })
                        .then(function() {
                            return firebase.firestore().collection('users').doc(cred.user.uid).set({
                                firstName: firstName,
                                lastName: lastName,
                                name: firstName + ' ' + lastName,
                                email: email,
                                phone: phone,
                                ghanaCard: {
                                    number: ghanaCardNumber,
                                    name: ghanaCardName,
                                    submittedAt: firebase.firestore.FieldValue.serverTimestamp()
                                },
                                role: 'user',
                                status: 'pending',
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        })
                        .then(function() {
                            return firebase.auth().signOut();
                        });
                })
                .then(function() {
                    showFlash('Account created! Pending admin approval. You\'ll receive an email once verified.', 'success');
                    btnSpan.textContent = 'Redirecting to login...';
                    setTimeout(function() { window.location.replace('login.html'); }, 3000);
                })
                .catch(function(error) {
                    var msg = 'Registration failed. Please try again.';
                    if (error.code) {
                        switch(error.code) {
                            case 'auth/email-already-in-use': msg = 'This email is already registered.'; break;
                            case 'auth/weak-password': msg = 'Password is too weak. Use at least 8 characters.'; break;
                            case 'auth/invalid-email': msg = 'Invalid email address.'; break;
                            default: msg = error.message || msg;
                        }
                    }
                    showFlash(msg, 'error');
                    resetBtn();
                });

            function resetBtn() {
                setTimeout(function() {
                    btnSpan.textContent = 'Create Account';
                    btnIcon.className = 'fas fa-user-plus';
                    registerBtn.disabled = false;
                }, 2000);
            }
        });

        function showFlash(message, type) {
            document.querySelectorAll('.flash').forEach(function(f) { f.remove(); });
            var colors = { success: '#22c55e', error: '#ef4444', warning: '#f59e0b', info: '#3b82f6' };
            var icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
            var flash = document.createElement('div');
            flash.className = 'flash';
            flash.style.background = colors[type] || colors.info;
            flash.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + message;
            document.body.appendChild(flash);
            setTimeout(function() { flash.style.animation = 'flashOut 0.3s ease forwards'; setTimeout(function() { flash.remove(); }, 300); }, 5000);
        }
    });
    </script>
</body>
</html>
