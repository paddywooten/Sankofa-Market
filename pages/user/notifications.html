<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0064d2">
<title>Alerts — Sankofa Market</title>
<meta name="description" content="Order updates, payouts and auction results from Sankofa Market.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/images/favicon.ico">
<link rel="stylesheet" href="/css/icons.css?v=2">
<link rel="stylesheet" href="/css/main.css?v=33">
<link rel="stylesheet" href="/css/a11y.css?v=2">
<style>
  :root{--blue:#0064d2;--gold:#f5af02;--ink:#111827;--muted:#5a6572;--line:#e5e7eb;}
  body{background:#f6f8fb;margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);}
  .wrap{max-width:760px;margin:0 auto;padding:1rem 0.9rem 5rem;}
  .page-head{background:linear-gradient(135deg,var(--blue),#004a9e);color:#fff;border-radius:16px;padding:1.1rem 1.2rem;margin-bottom:1rem;display:flex;align-items:center;gap:0.9rem;}
  .page-head .ic{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
  .page-head h1{margin:0;font-size:1.35rem;display:flex;gap:0.5rem;align-items:baseline;flex-wrap:wrap;}
  .page-head h1 span{color:var(--gold);}
  .page-head p{margin:0.25rem 0 0;font-size:0.84rem;color:#ffffff;opacity:1;text-shadow:0 1px 2px rgba(0,0,0,0.12);}
  .toolbar{display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;margin-bottom:0.8rem;}
  .toolbar .spacer{flex:1;}
  .chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:0.45rem 0.85rem;font-weight:700;font-size:0.78rem;cursor:pointer;color:#374151;min-height:40px;display:inline-flex;align-items:center;gap:0.35rem;}
  .chip.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .chip.ghost{background:#fff;color:var(--blue);border-color:#cfe1f7;}
  .notif{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:0.85rem 0.95rem;display:flex;gap:0.8rem;margin-bottom:0.6rem;cursor:pointer;}
  .notif.unread{border-color:#bfdbfe;background:#f8fbff;box-shadow:0 1px 3px rgba(0,100,210,0.06);}
  .notif .icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1rem;background:#eff6ff;color:var(--blue);}
  .notif.money .icon{background:#f0fdf4;color:#166534;}
  .notif.alert .icon{background:#fffbeb;color:#92400e;}
  .notif.warn .icon{background:#fef2f2;color:#991b1b;}
  .notif .body{flex:1;min-width:0;}
  .notif .title{font-weight:800;font-size:0.92rem;display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;}
  .notif .msg{font-size:0.83rem;color:#374151;line-height:1.5;margin-top:0.15rem;white-space:pre-line;}
  .notif .meta{font-size:0.72rem;color:var(--muted);margin-top:0.3rem;display:flex;gap:0.6rem;flex-wrap:wrap;align-items:center;}
  .notif .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block;}
  .notif .actions{margin-top:0.5rem;display:flex;gap:0.4rem;flex-wrap:wrap;}
  .notif .actions a, .notif .actions button{border-radius:8px;padding:0.42rem 0.7rem;font-weight:800;font-size:0.76rem;text-decoration:none;display:inline-flex;align-items:center;gap:0.3rem;min-height:40px;}
  .notif .actions a{background:var(--blue);color:#fff;border:none;}
  .notif .actions button{background:#fff;border:1.5px solid var(--line);color:#4b5563;cursor:pointer;}
  .empty{background:#fff;border:1.5px dashed var(--line);border-radius:14px;padding:2.4rem 1rem;text-align:center;color:var(--muted);}
  .empty h2{margin:0.6rem 0 0.25rem;font-size:1.05rem;color:var(--ink);}
  .skeleton{background:#fff;border:1.5px solid var(--line);border-radius:14px;height:74px;margin-bottom:0.6rem;opacity:.6;}
</style>
</head>
<body>

<div class="wrap">
  <div class="page-head">
    <div class="ic"><i class="fas fa-bell"></i></div>
    <div>
      <h1>Sankofa <span>Alerts</span></h1>
      <p>Order updates, payouts, auctions and messages from support.</p>
    </div>
  </div>

  <div class="toolbar">
    <button class="chip active" data-filter="all" onclick="notifFilter('all')">All</button>
    <button class="chip" data-filter="unread" onclick="notifFilter('unread')">Unread <span id="notifUnreadChip"></span></button>
    <button class="chip" data-filter="orders" onclick="notifFilter('orders')">Orders</button>
    <button class="chip" data-filter="money" onclick="notifFilter('money')">Money</button>
    <span class="spacer"></span>
    <button class="chip ghost" id="markAllBtn" onclick="markAllNotificationsRead()"><i class="fas fa-check-double"></i> Mark all read</button>
  </div>

  <div id="notifList">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
<script src="/config/firebase-config.js?v=6"></script>
<script src="/js/watchdog.js?v=2"></script>
<script src="/dist/main-TOATJ45B.js"></script>
<script src="/js/user-notifications.js?v=4"></script>
    <script src="/js/maintenance-mode.js?v=1"></script>
</body>
</html>
