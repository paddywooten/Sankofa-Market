<!DOCTYPE html>
<html lang="en-GH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Temporarily unavailable — Sankofa Market</title>
  <link rel="icon" type="image/png" href="/images/logos/sankofa-market-favicon.png">
  <style>
    :root{color-scheme:light;font-family:Inter,Arial,sans-serif;color:#191919;background:#f8fafc}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.25rem}
    main{width:min(100%,520px);background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:2.25rem 1.5rem;text-align:center;box-shadow:0 16px 50px rgba(15,23,42,.08)}
    .mark{width:54px;height:54px;display:grid;place-items:center;margin:0 auto 1rem;border-radius:16px;background:#fff7df;color:#8a5a00;font-size:1.6rem}
    img{display:block;width:min(220px,70%);height:auto;margin:0 auto 1.35rem}
    h1{font-size:1.55rem;line-height:1.25;margin:.2rem 0 .6rem}
    p{color:#5a6572;font-size:.95rem;line-height:1.65;margin:.4rem 0}
    .actions{display:flex;gap:.65rem;flex-wrap:wrap;justify-content:center;margin-top:1.3rem}
    a,button{border:0;border-radius:9px;padding:.7rem 1rem;font:inherit;font-size:.9rem;font-weight:700;text-decoration:none;cursor:pointer}
    .retry{background:#0064d2;color:#fff}
    .admin{background:#fff;border:1px solid #d1d5db;color:#374151}
    .note{margin-top:1.3rem;font-size:.75rem;color:#94a3b8}
    @media(max-width:420px){main{padding:1.7rem 1.1rem}h1{font-size:1.35rem}}
  </style>
</head>
<body>
  <main aria-labelledby="maintenanceTitle">
    <div class="mark" aria-hidden="true">⚙</div>
    <img src="/images/logos/sankofa-market-logo-full-color.png" alt="Sankofa Market">
    <h1 id="maintenanceTitle">We’re making a few updates</h1>
    <p>Sankofa Market is temporarily unavailable while we carry out maintenance. Please check back soon.</p>
    <p>Your account and orders are safe. We have not deleted or changed them.</p>
    <div class="actions">
      <button class="retry" type="button" onclick="window.location.href=window.location.href">Check again</button>
      <a class="admin" href="/pages/admin/login.html">Admin sign in</a>
    </div>
    <p class="note">Need urgent help? <a href="mailto:sankofamarketgh@gmail.com" style="padding:0;color:#0064d2;text-decoration:underline;">Contact Sankofa Market</a>.</p>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="/config/firebase-config.js?v=7"></script>
  <script src="/js/maintenance-mode.js?v=1"></script>
</body>
</html>
